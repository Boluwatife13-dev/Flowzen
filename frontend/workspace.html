<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <p class="small"><a href="workspaces.html">← All workspaces</a></p>
  <div id="content"></div>
</div>

<dialog id="editDialog">
  <form id="editForm">
    <h2>Edit workspace</h2>
    <div class="error-box hidden"></div>
    <label><span>Name</span><input name="name" required minlength="2"></label>
    <label><span>Description</span><textarea name="description"></textarea></label>
    <label><span>Owner</span><select name="ownerId"></select></label>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn" type="submit">Save</button></div>
  </form>
</dialog>

<dialog id="memberDialog">
  <form id="memberForm">
    <h2>Add / invite member</h2>
    <div class="error-box hidden"></div>
    <label><span>Team member</span><select name="userId" required></select></label>
    <label><span>Role</span><select name="role"><option value="member">Member</option><option value="manager">Manager</option></select></label>
    <p class="small muted">They get a notification and an email invitation.</p>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn" type="submit">Add</button></div>
  </form>
</dialog>

<dialog id="projectDialog">
  <form id="projectForm">
    <h2>New project</h2>
    <div class="error-box hidden"></div>
    <label><span>Name</span><input name="name" required minlength="2"></label>
    <label><span>Description</span><textarea name="description"></textarea></label>
    <div class="grid g2">
      <label><span>Status</span><select name="status"></select></label>
      <label><span>Owner</span><select name="ownerId"></select></label>
      <label><span>Start date</span><input type="date" name="startDate"></label>
      <label><span>Deadline</span><input type="date" name="deadline"></label>
    </div>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn" type="submit">Create</button></div>
  </form>
</dialog>

<script src="js/app.js"></script>
<script>
  const workspaceId = param('id');
  let data;

  async function loadWorkspace() {
    loading($('#content'));
    try { data = await api('/workspaces/' + workspaceId); } catch (error) { return showError($('#content'), error); }
    const ws = data.workspace;
    const people = byId(data.users);
    const canOwn = data.myRole === 'admin' || data.myRole === 'owner';
    document.title = ws.name + ' · Flowzen';

    const projects = data.projects.map((item) => `<tr><td><a href="project.html?id=${item.project.id}">${esc(item.project.name)}</a></td>
      <td>${badge(item.project.status)}</td><td>${formatDate(item.project.deadline)}</td><td style="width:170px">${progressBar(item.progress.percent)}</td></tr>`).join('');

    const members = ws.members.map((m) => {
      const user = people[m.userId] || { name: 'Unknown' };
      const editable = data.canManage && m.role !== 'owner';
      return `<tr><td><div class="row">${avatar(user)}${esc(user.name)}</div></td>
        <td>${editable ? `<select onchange="saveMember('${m.userId}', this.value)">${options(['manager', 'member'], m.role)}</select>` : badge(m.role)}</td>
        <td>${editable ? `<button class="btn danger sm" onclick="removeMember('${m.userId}')">Remove</button>` : ''}</td></tr>`;
    }).join('');

    $('#content').innerHTML = `
      <div class="page-head">
        <div><h1>${esc(ws.name)}</h1><div class="muted">${esc(ws.description) || 'No description'}</div>
          <div class="small muted">Your role: ${words(data.myRole)} · Created ${formatDate(ws.createdAt)}</div></div>
        <div class="row">
          ${data.canManage ? `<button class="btn" onclick="openDialog('projectDialog')">+ New project</button><button class="btn light" onclick="openDialog('editDialog')">Edit</button>` : ''}
          ${canOwn ? '<button class="btn danger" onclick="deleteWorkspace()">Delete</button>' : ''}
        </div>
      </div>
      <div class="card"><h2>Projects</h2>${projects ? `<table><tr><th>Project</th><th>Status</th><th>Deadline</th><th>Progress</th></tr>${projects}</table>` : empty('No projects you can access yet')}</div>
      <div class="card"><div class="row between"><h2>Members</h2>${data.canManage ? `<button class="btn sm" onclick="openMemberDialog()">+ Add member</button>` : ''}</div>
        <table><tr><th>Member</th><th>Role</th><th></th></tr>${members}</table></div>
      <div class="card"><h2>Recent activity</h2>${activityList(data.activity)}</div>`;

    // fill the edit and new-project forms
    const memberUsers = ws.members.map((m) => people[m.userId]).filter(Boolean);
    const edit = $('#editForm').elements;
    edit.name.value = ws.name;
    edit.description.value = ws.description;
    edit.ownerId.innerHTML = userOptions(memberUsers, [ws.ownerId]);
    edit.ownerId.disabled = !canOwn;
    $('#projectForm').elements.status.innerHTML = options(['planning', 'active', 'on_hold', 'completed', 'cancelled'], 'planning');
    $('#projectForm').elements.ownerId.innerHTML = userOptions(memberUsers, [ME.id]);
  }

  async function openMemberDialog() {
    try {
      const team = await api('/team');
      const available = team.filter((u) => u.active && u.role !== 'sysadmin' && !data.workspace.members.some((m) => m.userId === u.id));
      if (!available.length) return toast('Everyone in your team is already a member', true);
      $('#memberForm').elements.userId.innerHTML = userOptions(available);
      openDialog('memberDialog');
    } catch (error) { toastError(error); }
  }

  async function saveMember(userId, role) {
    try {
      await api(`/workspaces/${workspaceId}/members`, 'POST', { userId, role });
      toast('Role saved');
    } catch (error) { toastError(error); loadWorkspace(); }
  }

  async function removeMember(userId) {
    if (!confirm('Remove this member from the workspace and its projects?')) return;
    try {
      await api(`/workspaces/${workspaceId}/members/${userId}`, 'DELETE');
      toast('Member removed');
      loadWorkspace();
    } catch (error) { toastError(error); }
  }

  async function deleteWorkspace() {
    if (!confirm('Delete this workspace? All its projects, tasks, comments and files will be removed.')) return;
    try {
      await api('/workspaces/' + workspaceId, 'DELETE');
      location.href = 'workspaces.html';
    } catch (error) { toastError(error); }
  }

  async function init() {
    if (!await startPage('workspaces')) return;
    handleForm($('#editForm'), async (form) => {
      await api('/workspaces/' + workspaceId, 'PUT', form);
      toast('Workspace saved');
      loadWorkspace();
    });
    handleForm($('#memberForm'), async (form) => {
      await api(`/workspaces/${workspaceId}/members`, 'POST', form);
      toast('Member added');
      loadWorkspace();
    });
    handleForm($('#projectForm'), async (form) => {
      const project = await api('/projects', 'POST', { ...form, workspaceId });
      location.href = 'project.html?id=' + project.id;
    });
    loadWorkspace();
  }

  init();
</script>
</body>
</html>
