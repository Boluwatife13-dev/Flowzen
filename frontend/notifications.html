<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <div class="page-head"><div><h1>Notifications</h1><div class="muted" id="summary"></div></div>
    <div class="row"><label class="row" style="margin:0"><input type="checkbox" id="unreadOnly"> Unread only</label>
      <button class="btn light" onclick="markAllRead()">Mark all as read</button></div></div>
  <div class="card"><div id="list"></div><div id="pager"></div></div>
</div>

<script src="js/app.js"></script>
<script>
  let page = 1;

  async function loadNotifications() {
    loading($('#list'));
    try {
      const result = await api(`/notifications?page=${page}&limit=20${$('#unreadOnly').checked ? '&unread=1' : ''}`);
      $('#summary').textContent = result.unread + ' unread';
      $('#list').innerHTML = result.items.map((n) => `<div class="list-item ${n.read ? '' : 'unread'}">
        <div><a href="${esc(n.link)}" onclick="markRead('${n.id}')">${esc(n.message)}</a><div class="small muted">${formatTime(n.createdAt)}</div></div>
        ${n.read ? '' : `<button class="btn light sm" onclick="markRead('${n.id}', true)">Mark read</button>`}</div>`).join('') || empty('You are all caught up');
      pager($('#pager'), result, (p) => { page = p; loadNotifications(); });
    } catch (error) { showError($('#list'), error); }
  }

  async function markRead(id, reload) {
    await api(`/notifications/${id}/read`, 'POST').catch(toastError);
    if (reload) { loadNotifications(); updateUnreadCount(); }
  }

  async function markAllRead() {
    await api('/notifications/read-all', 'POST').catch(toastError);
    loadNotifications();
    updateUnreadCount();
  }

  async function init() {
    if (!await startPage('notifications', { needsApproval: false })) return;
    $('#unreadOnly').onchange = () => { page = 1; loadNotifications(); };
    loadNotifications();
  }

  init();
</script>
</body>
</html>
