<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project · Flowzen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <p class="small"><a href="projects.html">← All projects</a></p>
  <div id="head"></div>
  <div class="tabs" id="tabs"><button data-t="tasks" class="active">Tasks</button><button data-t="members">Members</button><button data-t="activity">Activity</button></div>
  <div id="tab"></div>
</div>
<script src="js/app.js"></script>
<script>
(async () => {
  if (!await layout('projects')) return;
  const id = qs('id');
  let d, tab = 'tasks', taskList = [];

  const assignable = () => {
    const list = [...d.members];
    const admin = d.wsMembers.find((u) => u.id === d.project.adminId);
    if (admin && !list.some((u) => u.id === admin.id)) list.push(admin);
    return list;
  };

  const renderHead = () => {
    const p = d.project, pr = d.progress, owner = d.wsMembers.concat(d.members).find((u) => u.id === p.ownerId);
    document.title = p.name + ' · Flowzen';
    $('#head').innerHTML = `<div class="page-head"><div><h1>${esc(p.name)} ${badge(p.status)}</h1><div class="muted">${esc(p.description) || 'No description'}</div>
        <div class="small muted" style="margin-top:6px">Workspace: <a href="workspace.html?id=${d.workspace.id}">${esc(d.workspace.name)}</a> · Owner: ${esc(owner ? owner.name : '—')}
        · ${fmtDate(p.startDate)} → ${fmtDate(p.deadline)} · Your role: ${label(d.myRole)}</div></div>
        <div class="row">${['manager', 'contributor'].includes(d.myRole) ? '<button class="btn" id="newTask">+ New task</button>' : ''}
        ${d.canManage ? '<button class="btn light" id="edit">Edit</button><button class="btn danger" id="del">Delete</button>' : ''}</div></div>
      <div class="grid g4" style="margin-bottom:18px"><div class="stat"><span class="muted">Total tasks</span><b>${pr.total}</b></div>
        <div class="stat"><span class="muted">Completed</span><b>${pr.completed}</b></div><div class="stat"><span class="muted">Overdue</span><b>${pr.overdue}</b></div>
        <div class="stat"><span class="muted">Progress</span><b>${pr.percent}%</b>${progressBar(pr.percent)}</div></div>`;
    const on = (s, fn) => { const el = $(s); if (el) el.onclick = fn; };
    on('#newTask', () => openModal('New task', taskFormHtml({}, assignable(), taskList.map((x) => ({ id: x.task.id, title: x.task.title })), d.canManage), async (f) => {
      const t = await api('/tasks', { body: { ...taskPayload(f), projectId: id } }); toast('Task created'); location.href = 'task.html?id=' + t.id;
    }, 'Create task'));
    on('#edit', () => openModal('Edit project', `<label><span>Name *</span><input name="name" required minlength="2" value="${esc(p.name)}"></label>
      <label><span>Description</span><textarea name="description">${esc(p.description)}</textarea></label>
      <div class="grid g2"><label><span>Status</span><select name="status">${options(PROJECT_STATUSES, p.status)}</select></label>
      <label><span>Owner</span><select name="ownerId">${userOptions(d.wsMembers, p.ownerId)}</select></label>
      <label><span>Start date</span><input type="date" name="startDate" value="${esc(p.startDate)}"></label>
      <label><span>Deadline</span><input type="date" name="deadline" value="${esc(p.deadline)}"></label></div>`,
      async (f) => { await api('/projects/' + id, { method: 'PUT', body: f }); toast('Project updated'); load(); }));
    on('#del', async () => {
      if (!await confirmBox(`Delete project "${p.name}" and all of its tasks?`)) return;
      try { await api('/projects/' + id, { method: 'DELETE' }); toast('Project deleted'); location.href = 'projects.html'; } catch (e) { fail(e); }
    });
  };

  const renderTab = () => {
    const el = $('#tab');
    if (tab === 'tasks') {
      el.innerHTML = `<div class="card"><div class="filters"><select id="fStatus" aria-label="Status"><option value="">All statuses</option>${options(STATUSES)}</select>
        <select id="fPriority" aria-label="Priority"><option value="">All priorities</option>${options(PRIORITIES)}</select>
        <select id="fSort" aria-label="Sort"><option value="dueDate">Due date</option><option value="priority">Priority</option><option value="">Newest</option></select></div>
        <div class="table-wrap" id="tl"></div></div>`;
      const draw = () => {
        const s = $('#fStatus').value, pr = $('#fPriority').value;
        let list = taskList.filter((x) => (!s || x.task.status === s) && (!pr || x.task.priority === pr));
        const key = $('#fSort').value, rank = { low: 0, medium: 1, high: 2, urgent: 3 };
        list = [...list].sort((a, b) => key === 'priority' ? rank[b.task.priority] - rank[a.task.priority]
          : key === 'dueDate' ? (a.task.dueDate || '9999').localeCompare(b.task.dueDate || '9999') : b.task.createdAt.localeCompare(a.task.createdAt));
        $('#tl').innerHTML = list.length ? `<table><thead><tr><th>Task</th><th>Assignees</th><th>Priority</th><th>Status</th><th>Due</th></tr></thead><tbody>
          ${list.map((x) => `<tr><td><a href="task.html?id=${x.task.id}">${esc(x.task.title)}</a>${(x.task.labels || []).map((l) => ` <span class="badge label">${esc(l)}</span>`).join('')}</td>
            <td><div class="row">${x.assignees.map((a) => avatar(a)).join('') || '<span class="muted">—</span>'}</div></td><td>${badge(x.task.priority)}</td>
            <td>${badge(x.task.status)}</td><td>${fmtDate(x.task.dueDate)} ${x.overdue ? badge('overdue') : ''}</td></tr>`).join('')}</tbody></table>` : empty('No tasks here yet');
      };
      ['#fStatus', '#fPriority', '#fSort'].forEach((s) => $(s).onchange = draw);
      draw();
    } else if (tab === 'members') {
      const p = d.project;
      el.innerHTML = `<div class="card"><div class="row between"><h2>Project members</h2>${d.canManage ? '<button class="btn sm" id="addM">+ Add member</button>' : ''}</div>
        <div class="table-wrap"><table><thead><tr><th>Member</th><th>Role</th><th></th></tr></thead><tbody>
        ${d.members.map((m) => { const own = m.id === p.ownerId; return `<tr><td><div class="row">${avatar(m)}<div>${esc(m.name)}<div class="small muted">${esc(m.email)}</div></div></div></td>
          <td>${d.canManage && !own ? `<select data-role="${m.id}" aria-label="Role">${options(['manager', 'contributor', 'viewer'], p.roles[m.id])}</select>` : badge(own ? 'owner' : p.roles[m.id])}</td>
          <td class="right">${d.canManage && !own ? `<button class="btn danger sm" data-rm="${m.id}" data-name="${esc(m.name)}">Remove</button>` : ''}</td></tr>`; }).join('')}
        </tbody></table></div><p class="small muted">Managers edit the project and assign work · Contributors create tasks · Viewers read and comment.</p></div>`;
      const addM = $('#addM');
      if (addM) addM.onclick = () => {
        const cand = d.wsMembers.filter((u) => !p.memberIds.includes(u.id));
        if (!cand.length) return toast('All workspace members are already in this project. Add people to the workspace first.', 'error');
        openModal('Add project member', `<label><span>Workspace member *</span><select name="userId" required>${userOptions(cand)}</select></label>
          <label><span>Role</span><select name="role">${options(['contributor', 'manager', 'viewer'])}</select></label>`,
          async (f) => { await api(`/projects/${id}/members`, { body: f }); toast('Member added'); load(); }, 'Add');
      };
      el.querySelectorAll('[data-role]').forEach((s) => s.onchange = async () => {
        try { await api(`/projects/${id}/members/${s.dataset.role}`, { method: 'PUT', body: { role: s.value } }); toast('Role updated'); } catch (e) { fail(e); load(); }
      });
      el.querySelectorAll('[data-rm]').forEach((b) => b.onclick = async () => {
        if (!await confirmBox(`Remove ${b.dataset.name} from this project? They will be unassigned from its tasks.`, 'Remove')) return;
        try { await api(`/projects/${id}/members/${b.dataset.rm}`, { method: 'DELETE' }); toast('Member removed'); load(); } catch (e) { fail(e); }
      });
    } else {
      el.innerHTML = `<div class="card"><h2>Recent project activity</h2>${activityList(d.activity)}</div>`;
    }
  };

  const load = async () => {
    loading($('#tab'));
    try {
      [d, taskList] = await Promise.all([api('/projects/' + id), api(`/tasks?projectId=${id}&limit=500`).then((r) => r.items)]);
    } catch (e) { $('#head').innerHTML = ''; $('#tab').innerHTML = `<div class="error-box">${esc(e.message)}</div>`; return; }
    renderHead(); renderTab();
  };
  $('#tabs').onclick = (e) => {
    if (!e.target.dataset.t) return;
    $('#tabs .active').classList.remove('active'); e.target.classList.add('active');
    tab = e.target.dataset.t; if (d) renderTab();
  };
  load();
})();
</script>
</body>
</html>
