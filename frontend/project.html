<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <p class="small"><a href="projects.html">← All projects</a></p>
  <div id="content"></div>
</div>

<dialog id="editDialog">
  <form id="editForm">
    <h2>Edit project</h2>
    <div class="error-box hidden"></div>
    <label><span>Name</span><input name="name" required minlength="2"></label>
    <label><span>Description</span><textarea name="description"></textarea></label>
    <div class="grid g2">
      <label><span>Status</span><select name="status"></select></label>
      <label><span>Owner</span><select name="ownerId"></select></label>
      <label><span>Start date</span><input type="date" name="startDate"></label>
      <label><span>Deadline</span><input type="date" name="deadline"></label>
    </div>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn" type="submit">Save</button></div>
  </form>
</dialog>

<dialog id="memberDialog">
  <form id="memberForm">
    <h2>Add project member</h2>
    <div class="error-box hidden"></div>
    <label><span>Workspace member</span><select name="userId" required></select></label>
    <label><span>Role</span><select name="role"><option value="contributor">Contributor</option><option value="manager">Manager</option><option value="viewer">Viewer</option></select></label>
    <p class="small muted">Managers edit the project and assign work · Contributors create tasks · Viewers read and comment.</p>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn" type="submit">Add</button></div>
  </form>
</dialog>

<dialog id="taskDialog"><h2>New task</h2><form id="taskForm"></form></dialog>

<script src="js/app.js"></script>
<script>
  const projectId = param('id');
  let data, tasks, people;

  async function loadProject() {
    loading($('#content'));
    try {
      data = await api('/projects/' + projectId);
      tasks = await api(`/tasks?projectId=${projectId}&limit=200&sort=dueDate`);
    } catch (error) { return showError($('#content'), error); }
    const p = data.project;
    people = byId(data.users.concat(tasks.users));
    document.title = p.name + ' · Flowzen';
    const canCreate = data.myRole === 'manager' || data.myRole === 'contributor';

    const taskRows = tasks.items.map((t) => `<tr>
      <td><a href="task.html?id=${t.id}">${esc(t.title)}</a></td>
      <td>${t.assignees.map((id) => esc(people[id] ? people[id].name : '')).join(', ') || '—'}</td>
      <td>${badge(t.priority)}</td><td>${badge(t.status)}</td><td>${formatDate(t.dueDate)}</td></tr>`).join('');

    const memberRows = p.members.map((m) => {
      const user = people[m.userId] || { name: 'Unknown' };
      const editable = data.canManage && m.userId !== p.ownerId;
      return `<tr><td><div class="row">${avatar(user)}${esc(user.name)}</div></td>
        <td>${editable ? `<select onchange="saveMember('${m.userId}', this.value)">${options(['manager', 'contributor', 'viewer'], m.role)}</select>`
          : badge(m.userId === p.ownerId ? 'owner' : m.role)}</td>
        <td>${editable ? `<button class="btn danger sm" onclick="removeMember('${m.userId}')">Remove</button>` : ''}</td></tr>`;
    }).join('');

    const pr = data.progress;
    $('#content').innerHTML = `
      <div class="page-head">
        <div><h1>${esc(p.name)} ${badge(p.status)}</h1><div class="muted">${esc(p.description) || 'No description'}</div>
          <div class="small muted">Workspace: <a href="workspace.html?id=${data.workspace.id}">${esc(data.workspace.name)}</a>
            · Owner: ${esc(people[p.ownerId] ? people[p.ownerId].name : '—')} · ${formatDate(p.startDate)} → ${formatDate(p.deadline)} · Your role: ${words(data.myRole)}</div></div>
        <div class="row">
          ${canCreate ? `<button class="btn" onclick="openDialog('taskDialog')">+ New task</button>` : ''}
          ${data.canManage ? `<button class="btn light" onclick="openDialog('editDialog')">Edit</button><button class="btn danger" onclick="deleteProject()">Delete</button>` : ''}
        </div>
      </div>
      <div class="grid g4" style="margin-bottom:18px">
        <div class="stat"><span class="muted">Tasks</span><b>${pr.total}</b></div>
        <div class="stat"><span class="muted">Completed</span><b>${pr.completed}</b></div>
        <div class="stat"><span class="muted">Overdue</span><b>${pr.overdue}</b></div>
        <div class="stat"><span class="muted">Progress</span><b>${pr.percent}%</b>${progressBar(pr.percent)}</div>
      </div>
      <div class="card table-wrap"><h2>Tasks</h2>${taskRows ? `<table><tr><th>Task</th><th>Assignees</th><th>Priority</th><th>Status</th><th>Due</th></tr>${taskRows}</table>` : empty('No tasks yet')}</div>
      <div class="card"><div class="row between"><h2>Members</h2>${data.canManage ? `<button class="btn sm" onclick="openMemberDialog()">+ Add member</button>` : ''}</div>
        <table><tr><th>Member</th><th>Role</th><th></th></tr>${memberRows}</table></div>
      <div class="card"><h2>Recent activity</h2>${activityList(data.activity)}</div>`;

    // fill the dialogs
    const edit = $('#editForm').elements;
    edit.name.value = p.name;
    edit.description.value = p.description;
    edit.status.innerHTML = options(['planning', 'active', 'on_hold', 'completed', 'cancelled'], p.status);
    edit.ownerId.innerHTML = userOptions(workspacePeople(), [p.ownerId]);
    edit.startDate.value = p.startDate;
    edit.deadline.value = p.deadline;
    const assignable = p.members.map((m) => people[m.userId]).filter(Boolean);
    $('#taskForm').innerHTML = taskFormHTML(null, assignable, tasks.items, data.canManage);
  }

  // workspace members plus the workspace administrator
  function workspacePeople() {
    const ids = data.workspace.members.map((m) => m.userId);
    return data.users.filter((u) => ids.includes(u.id) || u.id === data.project.adminId);
  }

  function openMemberDialog() {
    const available = workspacePeople().filter((u) => !data.project.members.some((m) => m.userId === u.id));
    if (!available.length) return toast('Everyone in the workspace is already in this project', true);
    $('#memberForm').elements.userId.innerHTML = userOptions(available);
    openDialog('memberDialog');
  }

  async function saveMember(userId, role) {
    try {
      await api(`/projects/${projectId}/members`, 'POST', { userId, role });
      toast('Role saved');
    } catch (error) { toastError(error); loadProject(); }
  }

  async function removeMember(userId) {
    if (!confirm('Remove this member? They will be unassigned from the project tasks.')) return;
    try {
      await api(`/projects/${projectId}/members/${userId}`, 'DELETE');
      toast('Member removed');
      loadProject();
    } catch (error) { toastError(error); }
  }

  async function deleteProject() {
    if (!confirm('Delete this project and all of its tasks?')) return;
    try {
      await api('/projects/' + projectId, 'DELETE');
      location.href = 'projects.html';
    } catch (error) { toastError(error); }
  }

  async function init() {
    if (!await startPage('projects')) return;
    handleForm($('#editForm'), async (form) => {
      await api('/projects/' + projectId, 'PUT', form);
      toast('Project saved');
      loadProject();
    });
    handleForm($('#memberForm'), async (form) => {
      await api(`/projects/${projectId}/members`, 'POST', form);
      toast('Member added');
      loadProject();
    });
    handleForm($('#taskForm'), async (form) => {
      const task = await api('/tasks', 'POST', { ...taskData(form), projectId });
      location.href = 'task.html?id=' + task.id;
    });
    loadProject();
  }

  init();
</script>
</body>
</html>
