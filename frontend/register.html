<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
  <form class="card" id="registerForm">
    <div class="logo"><span>F</span>Flowzen</div>
    <p class="muted" style="text-align:center">Create your account</p>
    <div class="error-box hidden"></div>
    <div class="info hidden" id="done"></div>
    <label><span>Full name</span><input name="name" required minlength="2"></label>
    <label><span>Email</span><input name="email" type="email" required></label>
    <label><span>Password (at least 8 characters)</span><input name="password" type="password" required minlength="8"></label>
    <label><span>Confirm password</span><input name="confirm" type="password" required minlength="8"></label>
    <label><span>Administrator you want to work under (optional)</span>
      <select name="adminId" id="admins"><option value="">Choose later</option></select></label>
    <label><span>Message to the administrator (optional)</span><textarea name="message"></textarea></label>
    <button class="btn" type="submit" style="width:100%">Create account</button>
    <p class="small" style="text-align:center">Already registered? <a href="index.html">Log in</a></p>
  </form>

  <script src="js/app.js"></script>
  <script>
    api('/admins').then((admins) => {
      $('#admins').innerHTML += admins.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
    }).catch(toastError);

    handleForm($('#registerForm'), async (data) => {
      if (data.password !== data.confirm) throw new Error('The passwords do not match');
      const result = await api('/auth/register', 'POST', data);
      $('#registerForm').reset();
      $('#done').textContent = result.message;
      $('#done').classList.remove('hidden');
    });
  </script>
</body>
</html>
