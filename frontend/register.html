<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Flowzen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
<form class="card" id="f" novalidate>
  <div class="logo"><span>F</span>Flowzen</div>
  <p class="muted" style="text-align:center">Create your account</p>
  <div class="error-box hidden" role="alert"></div><div class="info hidden"></div>
  <label><span>Full name</span><input name="name" required minlength="2" maxlength="80"></label>
  <label><span>Email</span><input name="email" type="email" required></label>
  <label><span>Password (min 8 characters)</span><input name="password" type="password" required minlength="8"></label>
  <label><span>Confirm password</span><input name="confirm" type="password" required minlength="8"></label>
  <label><span>Administrator to work under (optional)</span>
    <input id="adminSearch" placeholder="Search administrators…" style="margin-bottom:6px">
    <select name="adminId" id="admins"><option value="">— Choose later —</option></select></label>
  <label><span>Message to administrator (optional)</span><textarea name="message" maxlength="500"></textarea></label>
  <button class="btn" type="submit" style="width:100%">Create account</button>
  <p class="small" style="text-align:center">Already have an account? <a href="index.html">Log in</a></p>
</form>
<script src="js/app.js"></script>
<script>
  async function loadAdmins(q = '') {
    try {
      const list = await api('/admins?q=' + encodeURIComponent(q));
      $('#admins').innerHTML = '<option value="">— Choose later —</option>' + list.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
    } catch (e) { fail(e); }
  }
  let timer; $('#adminSearch').oninput = (e) => { clearTimeout(timer); timer = setTimeout(() => loadAdmins(e.target.value), 300); };
  loadAdmins();
  authForm($('#f'), async (d) => {
    if (d.password !== d.confirm) throw new Error('Passwords do not match');
    const r = await api('/auth/register', { body: d });
    $('#f').reset();
    return r.message;
  });
</script>
</body>
</html>
