<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Flowzen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <div class="page-head"><div><h1 id="hello">Dashboard</h1><div class="muted" id="sub"></div></div>
    <div class="row" id="quick"></div></div>
  <div id="body"></div>
</div>
<script src="js/app.js"></script>
<script>
(async () => {
  if (!await layout('dashboard', { approval: false })) return;
  $('#hello').textContent = 'Welcome, ' + ME.name.split(' ')[0];
  $('#sub').textContent = ME.role.replace('_', ' ') + (MY_ADMIN ? ' · working under ' + MY_ADMIN.name : '');
  const body = $('#body');
  loading(body);
  let d;
  try { d = await api('/dashboard'); } catch (e) { body.innerHTML = `<div class="error-box">${esc(e.message)}</div>`; return; }
  if (!d.approved) {
    body.innerHTML = `<div class="card"><h2>Waiting for team access</h2><p class="muted">You need an administrator to approve you before you can see workspaces, projects and tasks.</p>
      <a class="btn" href="requests.html">Choose an administrator</a></div>`;
    return;
  }
  if (isApproved()) $('#quick').innerHTML = `<a class="btn" href="tasks.html?new=1">+ New task</a><a class="btn light" href="projects.html">Projects</a>`;
  const s = d.myStats, r = d.report, sum = r.summary || {};
  const stat = (t, v, href) => `<a class="stat" href="${href}" style="color:inherit;text-decoration:none"><span class="muted">${t}</span><b>${v}</b></a>`;
  let html = '';
  if (isAdmin()) {
    html += `<h2>${ME.role === 'sysadmin' ? 'Platform overview' : 'Team overview'}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px">
      ${ME.role === 'sysadmin' ? stat('Users', sum.users, 'admin.html') : stat('Team members', sum.teamSize, 'team.html')}
      ${stat('Pending requests', sum.pendingRequests, 'requests.html')}${stat('Workspaces', sum.workspaces, 'workspaces.html')}
      ${stat('Projects', sum.projects, 'projects.html')}${stat('All tasks', r.total, 'tasks.html')}${stat('Overdue', r.overdue, 'tasks.html?due=overdue')}</div>`;
  }
  html += `<h2>My work</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px">
    ${stat('Assigned to me', s.total, 'tasks.html?assignee=me')}${stat('Pending', s.pending, 'tasks.html?assignee=me&status=pending')}
    ${stat('In progress', s.in_progress, 'tasks.html?assignee=me&status=in_progress')}${stat('Completed', s.completed, 'tasks.html?assignee=me&status=completed')}
    ${stat('Overdue', s.overdue, 'tasks.html?assignee=me&due=overdue')}</div>
  <div class="grid g2">
    <div class="card"><div class="row between"><h2>My open tasks</h2><a href="tasks.html?assignee=me" class="small">View all</a></div>
      ${d.myTasks.length ? d.myTasks.map((t) => `<div class="list-item"><div><a href="task.html?id=${t.id}">${esc(t.title)}</a><div class="small muted">Due ${fmtDate(t.dueDate)}</div></div>
        <div class="row">${t.overdue ? badge('overdue') : ''}${badge(t.priority)}${badge(t.status)}</div></div>`).join('') : empty('Nothing assigned to you right now')}</div>
    <div class="card"><h2>Upcoming deadlines (7 days)</h2>
      ${r.upcoming.length ? r.upcoming.map((t) => `<div class="list-item"><div><a href="task.html?id=${t.id}">${esc(t.title)}</a><div class="small muted">${esc(t.project)}</div></div>
        <div class="row">${badge(t.priority)}<span class="small">${fmtDate(t.dueDate)}</span></div></div>`).join('') : empty('No deadlines this week')}</div>
    <div class="card"><div class="row between"><h2>Projects</h2><a href="projects.html" class="small">View all</a></div>
      ${r.projects.length ? r.projects.slice(0, 6).map((p) => `<div class="list-item"><div style="flex:1"><a href="project.html?id=${p.id}">${esc(p.name)}</a>
        <div class="small muted">${p.completed}/${p.total} tasks done${p.overdue ? ' · ' + p.overdue + ' overdue' : ''}</div></div><div style="width:130px">${progressBar(p.percent)}</div></div>`).join('') : empty('No projects yet')}</div>
    <div class="card"><div class="row between"><h2>Recent notifications</h2><a href="notifications.html" class="small">View all</a></div>
      ${d.notifications.length ? d.notifications.map((n) => `<div class="list-item ${n.read ? '' : 'unread'}"><a href="${esc(n.link)}">${esc(n.message)}</a>
        <span class="small muted" style="white-space:nowrap">${fmtTime(n.createdAt)}</span></div>`).join('') : empty('No notifications')}</div>
  </div>`;
  if (isAdmin() && r.workload.length) {
    html += `<div class="card"><h2>Team workload</h2><div class="table-wrap"><table><thead><tr><th>Member</th><th>Open</th><th>Completed</th><th>Overdue</th></tr></thead><tbody>
      ${r.workload.map((w) => `<tr><td><div class="row">${avatar(w.user)}${esc(w.user.name)}</div></td><td>${w.open}</td><td>${w.completed}</td><td>${w.overdue ? badge(String(w.overdue), 'overdue') : 0}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }
  html += `<div class="card"><h2>Recent activity</h2>${activityList(r.activity)}</div>`;
  body.innerHTML = html;
})();
</script>
</body>
</html>
