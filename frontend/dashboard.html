<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <div class="page-head">
    <div><h1 id="hello">Dashboard</h1><div class="muted" id="role"></div></div>
    <a class="btn hidden" id="newTask" href="tasks.html?new=1">+ New task</a>
  </div>
  <div id="content"></div>
</div>

<script src="js/app.js"></script>
<script>
  function stat(label, value, link) {
    return `<a class="stat" href="${link}" style="color:inherit;text-decoration:none"><span class="muted">${label}</span><b>${value || 0}</b></a>`;
  }

  async function loadDashboard() {
    if (!await startPage('dashboard', { needsApproval: false })) return;
    $('#hello').textContent = 'Welcome, ' + ME.name.split(' ')[0];
    $('#role').textContent = ME.role + (MY_ADMIN ? ' · working under ' + MY_ADMIN.name : '');
    loading($('#content'));

    let data;
    try { data = await api('/dashboard'); } catch (error) { return showError($('#content'), error); }

    if (!data.approved) {
      $('#content').innerHTML = `<div class="card"><h2>Waiting for team access</h2>
        <p class="muted">An administrator has to approve you before you can see workspaces, projects and tasks.</p>
        <a class="btn" href="requests.html">Choose an administrator</a></div>`;
      return;
    }
    $('#newTask').classList.remove('hidden');
    const report = data.report, summary = report.summary, mine = data.myStats;
    const grid = 'class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px"';
    let html = '';

    if (ME.role === 'admin' || ME.role === 'sysadmin') {
      html += `<h2>Team overview</h2><div ${grid}>
        ${ME.role === 'admin' ? stat('Team members', summary.teamSize, 'team.html') : stat('Users', summary.users, 'admin.html')}
        ${stat('Pending requests', summary.pendingRequests, 'requests.html')}
        ${stat('Projects', summary.projects, 'projects.html')}
        ${stat('All tasks', report.total, 'tasks.html')}
        ${stat('Overdue', report.overdue, 'tasks.html?due=overdue')}</div>`;
    }

    html += `<h2>My work</h2><div ${grid}>
      ${stat('Assigned to me', mine.total, 'tasks.html?assignee=me')}
      ${stat('Pending', mine.pending, 'tasks.html?assignee=me&status=pending')}
      ${stat('In progress', mine.in_progress, 'tasks.html?assignee=me&status=in_progress')}
      ${stat('Completed', mine.completed, 'tasks.html?assignee=me&status=completed')}
      ${stat('Overdue', mine.overdue, 'tasks.html?assignee=me&due=overdue')}</div>`;

    const myTasks = data.myTasks.map((t) => `<div class="list-item"><div><a href="task.html?id=${t.id}">${esc(t.title)}</a>
      <div class="small muted">Due ${formatDate(t.dueDate)}</div></div><div class="row">${badge(t.priority)}${badge(t.status)}</div></div>`).join('');
    const upcoming = report.upcoming.map((t) => `<div class="list-item"><a href="task.html?id=${t.id}">${esc(t.title)}</a>
      <span class="small">${formatDate(t.dueDate)}</span></div>`).join('');
    const projects = report.projects.slice(0, 6).map((p) => `<div class="list-item"><div style="flex:1"><a href="project.html?id=${p.id}">${esc(p.name)}</a>
      <div class="small muted">${p.completed}/${p.total} tasks done</div></div><div style="width:130px">${progressBar(p.percent)}</div></div>`).join('');
    const notifications = data.notifications.map((n) => `<div class="list-item ${n.read ? '' : 'unread'}"><a href="${esc(n.link)}">${esc(n.message)}</a>
      <span class="small muted">${formatTime(n.createdAt)}</span></div>`).join('');

    html += `<div class="grid g2">
      <div class="card"><h2>My open tasks</h2>${myTasks || empty('Nothing assigned to you right now')}</div>
      <div class="card"><h2>Upcoming deadlines</h2>${upcoming || empty('No deadlines in the next 7 days')}</div>
      <div class="card"><h2>Projects</h2>${projects || empty('No projects yet')}</div>
      <div class="card"><h2>Recent notifications</h2>${notifications || empty('No notifications')}</div>
    </div>`;

    if (ME.role === 'admin' && report.workload.length) {
      html += `<div class="card"><h2>Team workload</h2><table><tr><th>Member</th><th>Open</th><th>Completed</th><th>Overdue</th></tr>
        ${report.workload.map((w) => `<tr><td>${esc(w.user.name)}</td><td>${w.open}</td><td>${w.completed}</td><td>${w.overdue}</td></tr>`).join('')}</table></div>`;
    }
    html += `<div class="card"><h2>Recent activity</h2>${activityList(report.activity)}</div>`;
    $('#content').innerHTML = html;
  }

  loadDashboard();
</script>
</body>
</html>
