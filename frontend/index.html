<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
  <form class="card" id="loginForm">
    <div class="logo"><span>F</span>Flowzen</div>
    <p class="muted" style="text-align:center">Log in to manage your work</p>
    <div class="error-box hidden"></div>
    <label><span>Email</span><input name="email" type="email" required></label>
    <label><span>Password</span><input name="password" type="password" required></label>
    <button class="btn" type="submit" style="width:100%">Log in</button>
    <p class="row between small"><a href="forgot.html">Forgot password?</a><a href="register.html">Create an account</a></p>
    <p class="small"><a href="#" id="resend">Resend verification email</a></p>
  </form>

  <script src="js/app.js"></script>
  <script>
    if (localStorage.getItem('token')) location.href = 'dashboard.html';

    handleForm($('#loginForm'), async (data) => {
      const result = await api('/auth/login', 'POST', data);
      localStorage.setItem('token', result.token);
      location.href = 'dashboard.html';
    });

    $('#resend').onclick = async (event) => {
      event.preventDefault();
      const email = $('[name=email]').value.trim();
      if (!email) return toast('Type your email first', true);
      const result = await api('/auth/resend-verification', 'POST', { email }).catch(toastError);
      if (result) toast(result.message);
    };
  </script>
</body>
</html>
