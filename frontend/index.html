<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Flowzen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
<form class="card" id="f" novalidate>
  <div class="logo"><span>F</span>Flowzen</div>
  <p class="muted" style="text-align:center">Log in to manage your work</p>
  <div class="error-box hidden" role="alert"></div><div class="info hidden"></div>
  <label><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
  <label><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit" style="width:100%">Log in</button>
  <p class="row between small"><a href="forgot.html">Forgot password?</a><a href="register.html">Create an account</a></p>
  <p class="small"><a href="#" id="resend">Resend verification email</a></p>
</form>
<script src="js/app.js"></script>
<script>
  if (localStorage.getItem('fz_token')) location.href = 'dashboard.html';
  if (qs('expired')) { $('.info').textContent = 'Your session ended. Please log in again.'; $('.info').classList.remove('hidden'); }
  authForm($('#f'), async (d) => {
    const r = await api('/auth/login', { body: d });
    localStorage.setItem('fz_token', r.token);
    location.href = 'dashboard.html';
  });
  $('#resend').onclick = async (e) => {
    e.preventDefault();
    const email = $('[name=email]').value.trim();
    if (!email) return toast('Enter your email first', 'error');
    try { toast((await api('/auth/resend-verification', { body: { email } })).message); } catch (ex) { fail(ex); }
  };
</script>
</body>
</html>
