<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <h1>My Profile</h1>
  <div class="grid g2" style="margin-top:12px">
    <div class="card">
      <div class="row" style="margin-bottom:14px"><span id="picture"></span>
        <form class="row" onsubmit="uploadAvatar(event)"><input type="file" id="avatar" accept=".png,.jpg,.jpeg,.gif,.webp" required><button class="btn sm">Upload picture</button></form></div>
      <form id="profileForm">
        <div class="error-box hidden"></div>
        <label><span>Full name</span><input name="name" required minlength="2"></label>
        <label><span>Email</span><input id="email" disabled></label>
        <label><span>Job title</span><input name="title"></label>
        <label><span>Phone</span><input name="phone"></label>
        <button class="btn" type="submit">Save profile</button>
      </form>
    </div>
    <div>
      <div class="card"><h2>My team</h2><div id="team"></div></div>
      <div class="card"><h2>Change password</h2>
        <form id="passwordForm">
          <div class="error-box hidden"></div>
          <label><span>Current password</span><input type="password" name="current" required></label>
          <label><span>New password</span><input type="password" name="new" required minlength="8"></label>
          <label><span>Confirm new password</span><input type="password" name="confirm" required minlength="8"></label>
          <button class="btn" type="submit">Change password</button>
        </form></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  function showProfile() {
    $('#picture').innerHTML = avatar(ME).replace('class="avatar"', 'class="avatar lg"');
    const form = $('#profileForm').elements;
    form.name.value = ME.name;
    form.title.value = ME.title;
    form.phone.value = ME.phone;
    $('#email').value = ME.email;
    $('#team').innerHTML = MY_ADMIN ? `You work under <b>${esc(MY_ADMIN.name)}</b> (${esc(MY_ADMIN.email)})`
      : ['admin', 'sysadmin'].includes(ME.role) ? 'You are an administrator.' : 'You are not in a team yet. <a href="requests.html">Choose an administrator</a>.';
  }

  async function uploadAvatar(event) {
    event.preventDefault();
    const file = $('#avatar').files[0];
    if (file.size > 2 * 1024 * 1024) return toast('The picture must be 2 MB or smaller', true);
    const form = new FormData();
    form.append('avatar', file);
    try {
      ME.avatar = (await api('/me/avatar', 'POST', form)).avatar;
      showProfile();
      toast('Picture updated');
    } catch (error) { toastError(error); }
  }

  async function init() {
    if (!await startPage('profile', { needsApproval: false })) return;
    showProfile();
    handleForm($('#profileForm'), async (data) => {
      await api('/me', 'PUT', data);
      ME.name = data.name; ME.title = data.title; ME.phone = data.phone;
      toast('Profile saved');
    });
    handleForm($('#passwordForm'), async (data) => {
      if (data.new !== data.confirm) throw new Error('The new passwords do not match');
      await api('/me/password', 'POST', { current: data.current, new: data.new });
      localStorage.removeItem('token');
      alert('Password changed. Please log in again.');
      location.href = 'index.html';
    });
  }

  init();
</script>
</body>
</html>
