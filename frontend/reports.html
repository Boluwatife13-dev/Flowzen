<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <h1>Reports</h1>
  <div class="card" style="margin-top:12px"><div class="filters">
    <label style="margin:0"><span class="small">Tasks created from</span><input type="date" id="from"></label>
    <label style="margin:0"><span class="small">To</span><input type="date" id="to"></label>
    <label style="margin:0"><span class="small">Project</span><select id="project"><option value="">All projects</option></select></label>
  </div></div>
  <div id="content"></div>
</div>

<script src="js/app.js"></script>
<script>
  const stat = (label, value) => `<div class="stat"><span class="muted">${label}</span><b>${value || 0}</b></div>`;
  const grid = (html) => `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px">${html}</div>`;

  async function loadReport() {
    loading($('#content'));
    const query = new URLSearchParams({ from: $('#from').value, to: $('#to').value, projectId: $('#project').value });
    try {
      const r = await api('/reports?' + query);
      const s = r.summary;
      let html = grid(stat('Total tasks', r.total) + stat('Completed', r.completed) + stat('Incomplete', r.incomplete)
        + stat('Pending', r.byStatus.pending) + stat('In progress', r.byStatus.in_progress) + stat('Overdue', r.overdue));

      if (ME.role === 'sysadmin') {
        html += '<h2>Platform summary</h2>' + grid(stat('Users', s.users) + stat('Active users', s.activeUsers) + stat('Admins', s.admins)
          + stat('Pending requests', s.pendingRequests) + stat('Workspaces', s.workspaces) + stat('Projects', s.projects));
      } else if (ME.role === 'admin') {
        html += '<h2>Team summary</h2>' + grid(stat('Team members', s.teamSize) + stat('Pending requests', s.pendingRequests)
          + stat('Workspaces', s.workspaces) + stat('Projects', s.projects));
      }

      html += `<div class="card table-wrap"><h2>Project completion</h2>${r.projects.length ? `<table>
        <tr><th>Project</th><th>Workspace</th><th>Status</th><th>Deadline</th><th>Done</th><th>Overdue</th><th>Progress</th></tr>
        ${r.projects.map((p) => `<tr><td><a href="project.html?id=${p.id}">${esc(p.name)}</a></td><td>${esc(p.workspace)}</td><td>${badge(p.status)}</td>
          <td>${formatDate(p.deadline)}</td><td>${p.completed}/${p.total}</td><td>${p.overdue}</td><td style="width:170px">${progressBar(p.percent)}</td></tr>`).join('')}
        </table>` : empty('No projects')}</div>`;

      html += `<div class="grid g2">
        <div class="card"><h2>Team workload</h2>${r.workload.length ? `<table><tr><th>Person</th><th>Open</th><th>Done</th><th>Overdue</th></tr>
          ${r.workload.map((w) => `<tr><td>${esc(w.user.name)}</td><td>${w.open}</td><td>${w.completed}</td><td>${w.overdue}</td></tr>`).join('')}</table>` : empty('No assigned tasks')}</div>
        <div class="card"><h2>Upcoming deadlines</h2>${r.upcoming.map((t) => `<div class="list-item"><a href="task.html?id=${t.id}">${esc(t.title)}</a>
          <span class="small">${badge(t.priority)} ${formatDate(t.dueDate)}</span></div>`).join('') || empty('Nothing due in the next 7 days')}</div>
      </div>
      <div class="card"><h2>Recent activity</h2>${activityList(r.activity)}</div>`;
      $('#content').innerHTML = html;
    } catch (error) { showError($('#content'), error); }
  }

  async function init() {
    if (!await startPage('reports')) return;
    try {
      const projects = await api('/projects?limit=200');
      $('#project').innerHTML += projects.items.map((i) => `<option value="${i.project.id}">${esc(i.project.name)}</option>`).join('');
    } catch (error) { toastError(error); }
    ['#from', '#to', '#project'].forEach((id) => $(id).onchange = loadReport);
    loadReport();
  }

  init();
</script>
</body>
</html>
