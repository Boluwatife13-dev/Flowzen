<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <p class="small"><a href="tasks.html">← All tasks</a></p>
  <div id="content"></div>
</div>

<dialog id="editDialog"><h2>Edit task</h2><form id="editForm"></form></dialog>

<script src="js/app.js"></script>
<script>
  const taskId = param('id');
  let data, comments, people;

  async function loadTask() {
    try {
      data = await api('/tasks/' + taskId);
      comments = await api(`/tasks/${taskId}/comments`);
    } catch (error) { return showError($('#content'), error); }
    people = byId(data.users.concat(comments.users));
    const t = data.task;
    const name = (id) => esc(people[id] ? people[id].name : 'Unknown');
    document.title = t.title + ' · Flowzen';

    // subtasks
    const done = t.subtasks.filter((s) => s.done).length;
    const subtasks = t.subtasks.map((s, i) => `<div class="list-item">
      <label class="row" style="margin:0;font-weight:400"><input type="checkbox" ${s.done ? 'checked' : ''} ${data.canEdit ? '' : 'disabled'} onchange="toggleSubtask(${i}, this.checked)">
        <span style="${s.done ? 'text-decoration:line-through' : ''}">${esc(s.title)}</span></label>
      ${data.canEdit ? `<button class="btn light sm" onclick="deleteSubtask(${i})">✕</button>` : ''}</div>`).join('');

    // comments with their replies underneath
    const commentHTML = (c) => `<div class="comment">
      <div class="row">${avatar(people[c.userId])}<b>${name(c.userId)}</b><span class="small muted">${formatTime(c.createdAt)}${c.editedAt ? ' · edited' : ''}</span></div>
      <p>${esc(c.body)}</p>
      <div class="row small"><a href="#" onclick="replyTo('${c.id}'); return false">Reply</a>
        ${c.userId === ME.id ? `<a href="#" onclick="editComment('${c.id}'); return false">Edit</a>` : ''}
        ${c.userId === ME.id || data.myRole === 'manager' ? `<a href="#" onclick="deleteComment('${c.id}'); return false" style="color:var(--bad)">Delete</a>` : ''}</div>
      <div class="reply">${comments.items.filter((r) => r.parentId === c.id).map(commentHTML).join('')}</div></div>`;
    const commentList = comments.items.filter((c) => !c.parentId).map(commentHTML).join('');

    // files
    const files = t.files.map((f) => `<div class="list-item"><div><b>${esc(f.name)}</b>
      <div class="small muted">${esc(f.type)} · ${Math.max(1, Math.round(f.size / 1024))} KB · ${formatTime(f.uploadedAt)} · ${name(f.uploadedBy)}</div></div>
      <div class="row"><button class="btn light sm" onclick="downloadFile('${f.id}')">Download</button>
        ${f.uploadedBy === ME.id || data.canManage ? `<button class="btn danger sm" onclick="deleteFile('${f.id}')">Delete</button>` : ''}</div></div>`).join('');

    const dependencies = data.projectTasks.filter((x) => t.dependencies.includes(x.id))
      .map((x) => `<div class="list-item"><a href="task.html?id=${x.id}">${esc(x.title)}</a>${badge(x.status)}</div>`).join('');
    const mentionable = data.project.members.filter((id) => id !== ME.id && people[id]).map((id) => people[id]);

    $('#content').innerHTML = `
      <div class="page-head">
        <div><h1>${esc(t.title)}</h1>
          <div class="row">${badge(t.status)}${badge(t.priority)}${data.overdue ? badge('overdue') : ''}${t.labels.map((l) => `<span class="badge label">${esc(l)}</span>`).join('')}</div>
          <div class="small muted" style="margin-top:8px">Project <a href="project.html?id=${data.project.id}">${esc(data.project.name)}</a>
            · Created by ${name(t.createdBy)} on ${formatDate(t.createdAt)} · Start ${formatDate(t.startDate)} · Due ${formatDate(t.dueDate)}</div></div>
        <div class="row">
          ${data.canEdit ? `<select onchange="changeStatus(this.value)" style="width:auto">${options(['pending', 'in_progress', 'review', 'blocked', 'completed'], t.status)}</select>
            <button class="btn light" onclick="openDialog('editDialog')">Edit</button>` : ''}
          ${data.canManage ? '<button class="btn danger" onclick="deleteTask()">Delete</button>' : ''}
        </div>
      </div>
      <div class="grid g2">
        <div>
          <div class="card"><h2>Description</h2><p style="white-space:pre-wrap;margin:0">${esc(t.description) || '<span class="muted">No description</span>'}</p></div>
          <div class="card"><h2>Subtasks (${done}/${t.subtasks.length})</h2>${subtasks || empty('No subtasks')}
            ${data.canEdit ? `<form class="row" style="margin-top:10px" onsubmit="addSubtask(event)"><input id="newSubtask" placeholder="Add a subtask…" required style="flex:1"><button class="btn sm">Add</button></form>` : ''}</div>
          <div class="card"><h2>Comments (${comments.items.length})</h2>${commentList || empty('No comments yet')}
            <form id="commentForm" style="margin-top:12px">
              <div class="error-box hidden"></div>
              <input type="hidden" name="parentId"><div id="replyingTo" class="small muted"></div>
              <label><span>Add a comment</span><textarea name="body" required></textarea></label>
              <label><span>Mention people (they get notified)</span><select name="mentions" multiple>${userOptions(mentionable)}</select></label>
              <button class="btn" type="submit">Post comment</button>
            </form></div>
        </div>
        <div>
          <div class="card"><h2>Assignees</h2>${t.assignees.map((id) => `<div class="list-item"><div class="row">${avatar(people[id])}${name(id)}</div></div>`).join('') || empty('Nobody assigned')}</div>
          <div class="card"><h2>Depends on</h2>${dependencies || empty('No dependencies')}</div>
          <div class="card"><h2>Files (${t.files.length})</h2>${files || empty('No files attached')}
            ${data.canEdit || data.myRole === 'contributor' ? `<form class="row" style="margin-top:10px" onsubmit="uploadFile(event)"><input type="file" id="file" required style="flex:1"><button class="btn sm">Upload</button></form>
              <p class="small muted">Max 10 MB. Documents, images, CSV, TXT and ZIP.</p>` : ''}</div>
          <div class="card"><h2>History</h2>${activityList(data.activity)}</div>
        </div>
      </div>`;

    handleForm($('#commentForm'), async (form) => {
      await api(`/tasks/${taskId}/comments`, 'POST', form);
      toast('Comment posted');
      loadTask();
    });
    const assignable = data.project.members.concat([data.project.adminId]).filter((id) => people[id]).map((id) => people[id]);
    $('#editForm').innerHTML = taskFormHTML(t, assignable, data.projectTasks, data.canManage);
  }

  // runs an action, shows a message, then reloads the page data
  async function run(action, message) {
    try {
      await action();
      if (message) toast(message);
      loadTask();
    } catch (error) { toastError(error); }
  }

  const changeStatus = (status) => run(() => api('/tasks/' + taskId, 'PUT', { status }), 'Status updated');
  const saveSubtasks = (list) => run(() => api(`/tasks/${taskId}/subtasks`, 'PUT', { subtasks: list }));

  function addSubtask(event) {
    event.preventDefault();
    saveSubtasks(data.task.subtasks.concat([{ title: $('#newSubtask').value }]));
  }
  function toggleSubtask(index, checked) {
    const list = data.task.subtasks;
    list[index].done = checked;
    saveSubtasks(list);
  }
  function deleteSubtask(index) {
    saveSubtasks(data.task.subtasks.filter((s, i) => i !== index));
  }

  // replies always attach to the top comment, so a thread stays one level deep
  function replyTo(commentId) {
    const comment = comments.items.find((c) => c.id === commentId);
    $('#commentForm').elements.parentId.value = comment.parentId || comment.id;
    $('#replyingTo').innerHTML = `Replying to ${esc(people[comment.userId].name)} · <a href="#" onclick="cancelReply(); return false">cancel</a>`;
    $('#commentForm').elements.body.focus();
  }
  function cancelReply() {
    $('#commentForm').elements.parentId.value = '';
    $('#replyingTo').innerHTML = '';
  }
  function editComment(id) {
    const comment = comments.items.find((c) => c.id === id);
    const body = prompt('Edit your comment', comment.body);
    if (body && body.trim()) run(() => api('/comments/' + id, 'PUT', { body }), 'Comment saved');
  }
  function deleteComment(id) {
    if (confirm('Delete this comment and its replies?')) run(() => api('/comments/' + id, 'DELETE'), 'Comment deleted');
  }

  function uploadFile(event) {
    event.preventDefault();
    const file = $('#file').files[0];
    if (file.size > 10 * 1024 * 1024) return toast('The file is larger than 10 MB', true);
    const form = new FormData();
    form.append('file', file);
    run(() => api(`/tasks/${taskId}/files`, 'POST', form), 'File uploaded');
  }

  // downloads need the login token, so we fetch the file and save it from the browser
  async function downloadFile(fileId) {
    const fileName = data.task.files.find((f) => f.id === fileId).name;
    const response = await fetch(`${API_URL}/api/tasks/${taskId}/files/${fileId}`, {
      headers: { Authorization: 'Bearer ' + localStorage.getItem('token') },
    });
    if (!response.ok) return toast('Could not download the file', true);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(await response.blob());
    link.download = fileName;
    link.click();
  }

  function deleteFile(fileId) {
    if (confirm('Delete this file?')) run(() => api(`/tasks/${taskId}/files/${fileId}`, 'DELETE'), 'File deleted');
  }

  async function deleteTask() {
    if (!confirm('Delete this task with its comments and files?')) return;
    try {
      await api('/tasks/' + taskId, 'DELETE');
      location.href = 'project.html?id=' + data.project.id;
    } catch (error) { toastError(error); }
  }

  async function init() {
    if (!await startPage('tasks')) return;
    loading($('#content'));
    handleForm($('#editForm'), async (form) => {
      await api('/tasks/' + taskId, 'PUT', taskData(form));
      toast('Task saved');
      loadTask();
    });
    loadTask();
  }

  init();
</script>
</body>
</html>
