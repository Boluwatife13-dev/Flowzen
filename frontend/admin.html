<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Admin · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <h1>System Administration</h1>

  <div class="card" style="margin-top:12px"><h2>Users</h2>
    <div class="filters">
      <input id="search" placeholder="Search name or email…">
      <select id="role"><option value="">All roles</option><option value="sysadmin">System admin</option><option value="admin">Admin</option><option value="manager">Manager</option><option value="member">Member</option></select>
      <select id="status"><option value="">All statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
    </div>
    <div class="table-wrap" id="users"></div><div id="usersPager"></div>
  </div>

  <div class="card"><h2>All workspaces</h2><div class="table-wrap" id="workspaces"></div></div>

  <div class="grid g2">
    <div class="card"><h2>Platform activity</h2><div id="activity"></div></div>
    <div class="card"><h2>System events and errors</h2><div id="logs"></div><div id="logsPager"></div></div>
  </div>
</div>

<dialog id="userDialog">
  <h2 id="userName"></h2>
  <div id="userDetails"></div>
  <div class="row end"><button class="btn light" onclick="closeDialog(this)">Close</button></div>
</dialog>

<script src="js/app.js"></script>
<script>
  let userPage = 1, logPage = 1, users = [];

  async function loadUsers() {
    loading($('#users'));
    const query = new URLSearchParams({ page: userPage, q: $('#search').value, role: $('#role').value, status: $('#status').value });
    try {
      const result = await api('/admin/users?' + query);
      users = result.items;
      $('#users').innerHTML = users.length ? `<table><tr><th>User</th><th>Role</th><th>Verified</th><th>Status</th><th>Joined</th><th></th></tr>
        ${users.map((u) => `<tr>
          <td><a href="#" onclick="showUser('${u.id}'); return false">${esc(u.name)}</a><div class="small muted">${esc(u.email)}</div></td>
          <td>${u.id === ME.id || u.role === 'sysadmin' ? badge(u.role) : `<select onchange="updateUser('${u.id}', { role: this.value })">${options(['member', 'manager', 'admin'], u.role)}</select>`}</td>
          <td>${u.verified ? 'Yes' : 'No'}</td><td>${badge(u.active ? 'active' : 'inactive')}</td><td class="small">${formatDate(u.createdAt)}</td>
          <td>${u.id === ME.id ? '' : `<button class="btn light sm" onclick="updateUser('${u.id}', { active: ${!u.active} })">${u.active ? 'Deactivate' : 'Activate'}</button>`}</td>
        </tr>`).join('')}</table>` : empty('No users found');
      pager($('#usersPager'), result, (p) => { userPage = p; loadUsers(); });
    } catch (error) { showError($('#users'), error); }
  }

  function showUser(id) {
    const u = users.find((x) => x.id === id);
    $('#userName').textContent = u.name;
    $('#userDetails').innerHTML = `<p>${avatar(u)}</p><p><b>Email:</b> ${esc(u.email)}<br><b>Role:</b> ${words(u.role)}<br>
      <b>Status:</b> ${u.active ? 'Active' : 'Inactive'} · ${u.verified ? 'Verified' : 'Not verified'}<br>
      <b>Job title:</b> ${esc(u.title) || '—'}<br><b>Phone:</b> ${esc(u.phone) || '—'}<br><b>Joined:</b> ${formatTime(u.createdAt)}</p>`;
    openDialog('userDialog');
  }

  async function updateUser(id, changes) {
    if (changes.role === 'admin' && !confirm('Make this user an administrator? They will leave their current team and lead their own.')) return loadUsers();
    try {
      await api('/admin/users/' + id, 'PUT', changes);
      toast('User updated');
    } catch (error) { toastError(error); }
    loadUsers();
  }

  async function loadWorkspaces() {
    try {
      const result = await api('/workspaces?limit=200');
      $('#workspaces').innerHTML = result.items.length ? `<table><tr><th>Workspace</th><th>Projects</th><th>Members</th><th>Created</th><th></th></tr>
        ${result.items.map((i) => `<tr><td><a href="workspace.html?id=${i.workspace.id}">${esc(i.workspace.name)}</a></td><td>${i.projects}</td>
          <td>${i.workspace.members.length}</td><td>${formatDate(i.workspace.createdAt)}</td>
          <td><button class="btn danger sm" onclick="deleteWorkspace('${i.workspace.id}')">Delete</button></td></tr>`).join('')}</table>` : empty('No workspaces yet');
    } catch (error) { showError($('#workspaces'), error); }
  }

  async function deleteWorkspace(id) {
    if (!confirm('Delete this workspace and everything in it?')) return;
    try {
      await api('/workspaces/' + id, 'DELETE');
      toast('Workspace deleted');
      loadWorkspaces();
    } catch (error) { toastError(error); }
  }

  async function loadLogs() {
    try {
      const result = await api(`/admin/logs?page=${logPage}`);
      $('#logs').innerHTML = result.items.map((l) => `<div class="list-item"><div>${badge(l.level, l.level === 'error' ? 'blocked' : 'low')} ${esc(l.message)}</div>
        <span class="small muted">${formatTime(l.createdAt)}</span></div>`).join('') || empty('No events recorded');
      pager($('#logsPager'), result, (p) => { logPage = p; loadLogs(); });
    } catch (error) { showError($('#logs'), error); }
  }

  async function init() {
    if (!await startPage('admin', { onlyFor: ['sysadmin'] })) return;
    $('#search').oninput = () => { userPage = 1; loadUsers(); };
    $('#role').onchange = $('#status').onchange = () => { userPage = 1; loadUsers(); };
    loadUsers();
    loadWorkspaces();
    loadLogs();
    api('/activity?limit=15').then((r) => $('#activity').innerHTML = activityList(r.items)).catch((e) => showError($('#activity'), e));
  }

  init();
</script>
</body>
</html>
