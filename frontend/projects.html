<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <div class="page-head"><div><h1>Projects</h1><div class="muted">All projects you can access. Create projects from inside a workspace.</div></div></div>
  <div class="card">
    <div class="filters">
      <input id="search" placeholder="Search projects…">
      <select id="workspace"><option value="">All workspaces</option></select>
      <select id="status"><option value="">All statuses</option></select>
      <select id="sort"><option value="">Newest first</option><option value="name">Name</option><option value="deadline">Deadline</option></select>
    </div>
    <div class="table-wrap" id="list"></div>
    <div id="pager"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  let page = 1;

  async function loadProjects() {
    loading($('#list'));
    const query = new URLSearchParams({ page, q: $('#search').value, workspaceId: $('#workspace').value, status: $('#status').value, sort: $('#sort').value });
    try {
      const result = await api('/projects?' + query);
      $('#list').innerHTML = result.items.length ? `<table><tr><th>Project</th><th>Workspace</th><th>Status</th><th>Deadline</th><th>Tasks</th><th>Progress</th></tr>
        ${result.items.map((item) => `<tr>
          <td><a href="project.html?id=${item.project.id}">${esc(item.project.name)}</a><div class="small muted">${words(item.myRole)}</div></td>
          <td>${esc(item.workspace)}</td><td>${badge(item.project.status)}</td><td>${formatDate(item.project.deadline)}</td>
          <td>${item.progress.completed}/${item.progress.total}${item.progress.overdue ? ' ' + badge(item.progress.overdue + ' overdue', 'overdue') : ''}</td>
          <td style="width:170px">${progressBar(item.progress.percent)}</td></tr>`).join('')}</table>`
        : empty('No projects match your filters');
      pager($('#pager'), result, (p) => { page = p; loadProjects(); });
    } catch (error) { showError($('#list'), error); }
  }

  async function init() {
    if (!await startPage('projects')) return;
    $('#status').innerHTML += options(['planning', 'active', 'on_hold', 'completed', 'cancelled']);
    try {
      const workspaces = await api('/workspaces?limit=200');
      $('#workspace').innerHTML += workspaces.items.map((i) => `<option value="${i.workspace.id}">${esc(i.workspace.name)}</option>`).join('');
    } catch (error) { toastError(error); }
    $('#search').oninput = () => { page = 1; loadProjects(); };
    ['#workspace', '#status', '#sort'].forEach((id) => $(id).onchange = () => { page = 1; loadProjects(); });
    loadProjects();
  }

  init();
</script>
</body>
</html>
