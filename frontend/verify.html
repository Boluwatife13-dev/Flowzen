<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
  <div class="card" style="text-align:center">
    <div class="logo"><span>F</span>Flowzen</div>
    <div id="result" class="loading">Verifying your email…</div>
    <p><a class="btn" href="index.html">Go to login</a></p>
  </div>

  <script src="js/app.js"></script>
  <script>
    api('/auth/verify', 'POST', { token: param('token') || '' })
      .then((result) => { $('#result').className = 'info'; $('#result').textContent = result.message; })
      .catch((error) => { $('#result').className = 'error-box'; $('#result').textContent = error.message; });
  </script>
</body>
</html>
