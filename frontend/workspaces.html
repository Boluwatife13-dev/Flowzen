<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspaces · Flowzen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <div class="page-head"><div><h1>Workspaces</h1><div class="muted">Spaces for your teams, holding projects and members.</div></div>
    <button class="btn hidden" id="new">+ New workspace</button></div>
  <div class="filters"><input id="q" placeholder="Search workspaces…" aria-label="Search workspaces"></div>
  <div class="grid g3" id="list"></div>
  <div id="pager"></div>
</div>
<script src="js/app.js"></script>
<script>
(async () => {
  if (!await layout('workspaces')) return;
  let page = 1;
  const load = async () => {
    const el = $('#list'); loading(el);
    try {
      const res = await api(`/workspaces?page=${page}&limit=12&q=${encodeURIComponent($('#q').value)}`);
      el.innerHTML = res.items.length ? res.items.map((x) => `<a class="card" href="workspace.html?id=${x.workspace.id}" style="color:inherit;text-decoration:none;margin:0">
        <div class="row between"><h2 style="margin:0">${esc(x.workspace.name)}</h2>${badge(x.myRole)}</div>
        <p class="muted">${esc(x.workspace.description) || 'No description'}</p><div class="small muted">${x.projects} project(s) · ${x.members} member(s)</div></a>`).join('')
        : `<div class="card" style="grid-column:1/-1">${empty('No workspaces found')}</div>`;
      pager($('#pager'), res, (p) => { page = p; load(); });
    } catch (e) { el.innerHTML = `<div class="error-box">${esc(e.message)}</div>`; }
  };
  if (['admin', 'manager', 'sysadmin'].includes(ME.role)) {
    $('#new').classList.remove('hidden');
    $('#new').onclick = () => openModal('New workspace', `<label><span>Name *</span><input name="name" required minlength="2" maxlength="100"></label>
      <label><span>Description</span><textarea name="description" maxlength="1000"></textarea></label>`,
      async (d) => { const ws = await api('/workspaces', { body: d }); toast('Workspace created'); location.href = 'workspace.html?id=' + ws.id; }, 'Create');
  }
  let t; $('#q').oninput = () => { clearTimeout(t); t = setTimeout(() => { page = 1; load(); }, 300); };
  load();
})();
</script>
</body>
</html>
