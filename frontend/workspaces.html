<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspaces · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <div class="page-head"><div><h1>Workspaces</h1><div class="muted">Team spaces that hold projects and members.</div></div>
    <button class="btn hidden" id="newButton" onclick="openDialog('newDialog')">+ New workspace</button></div>
  <div class="filters"><input id="search" placeholder="Search workspaces…"></div>
  <div class="grid g3" id="list"></div>
  <div id="pager"></div>
</div>

<dialog id="newDialog">
  <form id="newForm">
    <h2>New workspace</h2>
    <div class="error-box hidden"></div>
    <label><span>Name</span><input name="name" required minlength="2"></label>
    <label><span>Description</span><textarea name="description"></textarea></label>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn" type="submit">Create</button></div>
  </form>
</dialog>

<script src="js/app.js"></script>
<script>
  let page = 1;

  async function loadWorkspaces() {
    loading($('#list'));
    try {
      const result = await api(`/workspaces?page=${page}&limit=12&q=${encodeURIComponent($('#search').value)}`);
      $('#list').innerHTML = result.items.map((item) => `
        <a class="card" href="workspace.html?id=${item.workspace.id}" style="color:inherit;text-decoration:none;margin:0">
          <div class="row between"><h2 style="margin:0">${esc(item.workspace.name)}</h2>${badge(item.myRole)}</div>
          <p class="muted">${esc(item.workspace.description) || 'No description'}</p>
          <div class="small muted">${item.projects} project(s) · ${item.workspace.members.length} member(s)</div>
        </a>`).join('') || `<div class="card" style="grid-column:1/-1">${empty('No workspaces found')}</div>`;
      pager($('#pager'), result, (p) => { page = p; loadWorkspaces(); });
    } catch (error) { showError($('#list'), error); }
  }

  async function init() {
    if (!await startPage('workspaces')) return;
    if (ME.role !== 'member') $('#newButton').classList.remove('hidden');
    handleForm($('#newForm'), async (data) => {
      const workspace = await api('/workspaces', 'POST', data);
      location.href = 'workspace.html?id=' + workspace.id;
    });
    $('#search').oninput = () => { page = 1; loadWorkspaces(); };
    loadWorkspaces();
  }

  init();
</script>
</body>
</html>
