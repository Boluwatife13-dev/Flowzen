<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Flowzen</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
<form class="card" id="f" novalidate>
  <div class="logo"><span>F</span>Flowzen</div>
  <p class="muted" style="text-align:center">Choose a new password</p>
  <div class="error-box hidden" role="alert"></div><div class="info hidden"></div>
  <label><span>New password</span><input name="password" type="password" required minlength="8"></label>
  <label><span>Confirm password</span><input name="confirm" type="password" required minlength="8"></label>
  <button class="btn" type="submit" style="width:100%">Reset password</button>
  <p class="small" style="text-align:center"><a href="index.html">Back to login</a></p>
</form>
<script src="js/app.js"></script>
<script>
  authForm($('#f'), async (d) => {
    if (d.password !== d.confirm) throw new Error('Passwords do not match');
    const r = await api('/auth/reset', { body: { token: qs('token') || '', password: d.password } });
    $('#f').reset();
    return r.message;
  });
</script>
</body>
</html>
