<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
  <form class="card" id="resetForm">
    <div class="logo"><span>F</span>Flowzen</div>
    <p class="muted" style="text-align:center">Choose a new password</p>
    <div class="error-box hidden"></div>
    <div class="info hidden" id="done"></div>
    <label><span>New password</span><input name="password" type="password" required minlength="8"></label>
    <label><span>Confirm password</span><input name="confirm" type="password" required minlength="8"></label>
    <button class="btn" type="submit" style="width:100%">Reset password</button>
    <p class="small" style="text-align:center"><a href="index.html">Back to login</a></p>
  </form>

  <script src="js/app.js"></script>
  <script>
    handleForm($('#resetForm'), async (data) => {
      if (data.password !== data.confirm) throw new Error('The passwords do not match');
      const result = await api('/auth/reset', 'POST', { token: param('token') || '', password: data.password });
      $('#done').textContent = result.message;
      $('#done').classList.remove('hidden');
    });
  </script>
</body>
</html>
