<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Requests · Flowzen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="page">
  <h1 id="title">My Administrator</h1>

  <!-- shown to administrators -->
  <div id="adminView" class="hidden">
    <div class="filters" style="margin-top:12px">
      <select id="status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="">All</option></select>
    </div>
    <div class="card table-wrap" id="incoming"></div>
  </div>

  <!-- shown to everyone else -->
  <div id="memberView" class="hidden">
    <div class="card" id="current" style="margin-top:12px"></div>
    <div class="grid g2">
      <div class="card"><h2>Choose an administrator</h2>
        <input id="search" placeholder="Search by name…" style="margin-bottom:10px">
        <div id="admins"></div></div>
      <div class="card"><h2>My requests</h2><div id="mine"></div></div>
    </div>
  </div>
</div>

<dialog id="requestDialog">
  <form id="requestForm">
    <h2>Request to join</h2>
    <div class="error-box hidden"></div>
    <input type="hidden" name="adminId">
    <label><span>Message (optional)</span><textarea name="message" placeholder="Introduce yourself"></textarea></label>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn" type="submit">Send request</button></div>
  </form>
</dialog>

<dialog id="rejectDialog">
  <form id="rejectForm">
    <h2>Reject request</h2>
    <div class="error-box hidden"></div>
    <input type="hidden" name="requestId">
    <label><span>Reason (optional, sent to the person)</span><textarea name="note"></textarea></label>
    <div class="row end"><button type="button" class="btn light" onclick="closeDialog(this)">Cancel</button><button class="btn danger" type="submit">Reject</button></div>
  </form>
</dialog>

<script src="js/app.js"></script>
<script>
  // ----- administrators -----
  async function loadIncoming() {
    loading($('#incoming'));
    try {
      const result = await api('/requests/incoming?status=' + $('#status').value);
      const people = byId(result.users);
      $('#incoming').innerHTML = result.items.length ? `<table><tr><th>Person</th><th>Message</th><th>Date</th><th>Status</th><th></th></tr>
        ${result.items.map((r) => `<tr>
          <td>${esc(people[r.userId].name)}<div class="small muted">${esc(people[r.userId].email)}</div></td>
          <td>${esc(r.message) || '—'}${r.note ? `<div class="small muted">Note: ${esc(r.note)}</div>` : ''}</td>
          <td class="small">${formatTime(r.createdAt)}</td><td>${badge(r.status)}</td>
          <td>${r.status === 'pending' ? `<button class="btn ok sm" onclick="approve('${r.id}')">Approve</button>
            <button class="btn danger sm" onclick="reject('${r.id}')">Reject</button>` : ''}</td></tr>`).join('')}</table>`
        : empty('No requests here');
    } catch (error) { showError($('#incoming'), error); }
  }

  async function approve(id) {
    try {
      await api(`/requests/${id}/decide`, 'POST', { decision: 'approve' });
      toast('Request approved');
      loadIncoming();
    } catch (error) { toastError(error); }
  }

  function reject(id) {
    $('#rejectForm').reset();
    $('#rejectForm').elements.requestId.value = id;
    openDialog('rejectDialog');
  }

  // ----- members -----
  async function loadAdmins() {
    loading($('#admins'));
    try {
      const admins = await api('/admins?q=' + encodeURIComponent($('#search').value));
      $('#admins').innerHTML = admins.map((a) => `<div class="list-item"><b>${esc(a.name)}</b>
        ${MY_ADMIN && MY_ADMIN.id === a.id ? badge('current', 'approved') : `<button class="btn sm" onclick="askToJoin('${a.id}')">Request to join</button>`}</div>`).join('')
        || empty('No administrators found');
    } catch (error) { showError($('#admins'), error); }
  }

  async function loadMine() {
    try {
      const result = await api('/requests/mine');
      const people = byId(result.users);
      $('#mine').innerHTML = result.items.map((r) => `<div class="list-item"><div><b>${esc(people[r.adminId].name)}</b>
        <div class="small muted">${formatTime(r.createdAt)}${r.note ? ' · ' + esc(r.note) : ''}</div></div>${badge(r.status)}</div>`).join('')
        || empty('You have not sent any requests');
    } catch (error) { showError($('#mine'), error); }
  }

  function askToJoin(adminId) {
    $('#requestForm').reset();
    $('#requestForm').elements.adminId.value = adminId;
    openDialog('requestDialog');
  }

  async function init() {
    if (!await startPage('requests', { needsApproval: false })) return;

    if (ME.role === 'admin' || ME.role === 'sysadmin') {
      $('#title').textContent = 'Access Requests';
      $('#adminView').classList.remove('hidden');
      $('#status').onchange = loadIncoming;
      handleForm($('#rejectForm'), async (data) => {
        await api(`/requests/${data.requestId}/decide`, 'POST', { decision: 'reject', note: data.note });
        toast('Request rejected');
        loadIncoming();
      });
      loadIncoming();
      return;
    }

    $('#memberView').classList.remove('hidden');
    $('#current').innerHTML = MY_ADMIN
      ? `<h2>Your administrator</h2><div class="row">${avatar(MY_ADMIN)}<b>${esc(MY_ADMIN.name)}</b> <span class="muted">${esc(MY_ADMIN.email)}</span></div>`
      : `<h2>No administrator yet</h2><p class="muted">Send a request below. You get access to workspaces once it is approved.</p>`;
    $('#search').oninput = loadAdmins;
    handleForm($('#requestForm'), async (data) => {
      await api('/requests', 'POST', data);
      toast('Request sent');
      loadMine();
    });
    loadAdmins();
    loadMine();
  }

  init();
</script>
</body>
</html>
